<!DOCTYPE html>
<html>

<head>
    <title>Play Versions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #gameFrame {
            border: 1px solid #ccc;
            transition: width 0.3s, height 0.3s; /* Smooth transition effect */
        }
    </style>
</head>

<body>
    <h1>Select a version to play</h1>
    <div>
        <label for="resolutionSelect">Choose a resolution: </label>
        <select id="resolutionSelect" onchange="resizeIframe()">
            <option value="800,600">800x600</option>
            <option value="1024,768">1024x768</option>
            <option value="1280,720">1280x720</option>
            <option value="1920,1080">1920x1080</option>
        </select>
        <select id="versionSelect"></select>
    </div>
    <iframe id="gameFrame" width="800" height="600"></iframe>

    <script>
        function resizeIframe() {
            const select = document.getElementById("resolutionSelect");
            const [width, height] = select.value.split(','); // Get width and height
            var iframe = document.getElementById("gameFrame");
            console.log(width, height);
            iframe.width = width;
            iframe.height = height;
        }
        
        async function loadVersions() {
            const repo = "mrjsj/godot-asteroids"
            const resp = await fetch(`https://api.github.com/repos/${repo}/releases`);
            const releases = await resp.json();
            const versions = releases.map(r => r.tag_name);
            const select = document.getElementById("versionSelect");
            const iframe = document.getElementById("gameFrame");
            versions.forEach(v => {
                const opt = document.createElement("option");
                opt.value = v;
                opt.textContent = v;
                select.appendChild(opt);
            });
            select.onchange = () => {
                iframe.src = "versions/" + select.value + "/index.html";
            };
            select.value = versions[0];
            iframe.src = "versions/" + versions[0] + "/index.html";
        }
        loadVersions();
    </script>
</body>

</html>
